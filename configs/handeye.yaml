# handeye_test专用配置
height: 0.2
grid_num: 20
grid_size: 0.1
delay: 10

# 相机参数（从原配置复制）
camera_name: "mindvision"
exposure_ms: 15
gamma: 0.8
vid_pid: "f622:d13a"

# 相机内参
camera_matrix: [1903.33595, 0, 574.14733, 0, 1936.40478, 230.08993, 0, 0, 1]
distort_coeffs: [0.245050, -0.755077, -0.071354, -0.016195, 0.000000]

# 手眼标定结果
# R_camera2gimbal: [0.99887908863098296, 0.029709876306243773, 0.03684955285488211, -0.041262915318102007, 0.92798495412084214, 0.37032593312484818, -0.023193492949277777, -0.3714313505551276, 0.92817068134562708]
# t_camera2gimbal: [-0.0072332836665166475, -0.16930206575085011, -0.59362928820844496]
R_camera2gimbal: [0.99294201179074015, 0.091152024509492502, 0.075877991860443, -0.091045606853687774, 0.17583057258236048, 0.98020115648010031, 0.07600564908646161, -0.98019126611667606, 0.18288855386691108]
t_camera2gimbal: [-0.065256170326924476, 0.47603913275720738, 0.15214919896244644]
# IMU到云台的旋转
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# CBoard参数
quaternion_canid: 0x100
can_interface: "can0"


#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
#com_port: "/dev/pts/2"
#####-----planner-----#####
fire_thresh: 0.003
#####-----JLU TensorRT 10.3 auto_buff-----#####
jlu_buff:
  enable: true
  auto_fire_enable: true
  predict_offset_ms: 70.0
  detector:
    backend: tensorrt
    onnx_path: "models/buff/buff.onnx"
    engine_path: "models/buff/buff_trt10_3.engine"
    input_width: 640
    input_height: 640
    fp16: true
    confidence_threshold: 0.5
    nms_threshold: 0.45
    device_id: 0
    num_points: 5
  small_buff_conf:
    lost_threshold_sec: 0.8
    match_conf:
      max_match_distance_m: 1.0
      max_match_roll_diff_degree: 30.0
    blade_conf:
      pixel_error: {x: 5.0, y: 5.0}
      position_noise_m: {x: 0.03, y: 0.03, z: 0.03}
      roll_noise_degree: 2.0
    center_conf:
      position_consistency_noise_m: {x: 0.01, y: 0.01, z: 0.01}
      roll_noise_degree: 3.0
      vroll_noise_rad: 0.10
      position_prior_noise_m: {x: 0.10, y: 0.10, z: 0.10}
      roll_prior_noise_degree: 30.0
      vroll_prior_noise_rad: 6.0
  big_buff_conf:
    lost_threshold_sec: 1.0
    fitter_conf:
      queue_upper_limit: 200
      queue_lower_limit: 100
      param_lower_bound_scale: 1.0
      param_upper_bound_scale: 1.0
      curve_fitting_interval_time_ms: 20
    match_conf:
      max_match_distance_m: 1.0
      max_match_roll_diff_degree: 30.0
    blade_conf:
      pixel_error: {x: 5.0, y: 5.0}
      position_noise_m: {x: 0.03, y: 0.03, z: 0.03}
      roll_noise_degree: 2.0
    center_conf:
      position_consistency_noise_m: {x: 0.01, y: 0.01, z: 0.01}
      roll_noise_degree: 3.0
      vroll_noise_rad: 0.10
      position_prior_noise_m: {x: 0.10, y: 0.10, z: 0.10}
      roll_prior_noise_degree: 30.0
      vroll_prior_noise_rad: 6.0
  trajectory_conf:
    max_aim_iterate_count: 20
    aim_ok_error_m: 0.005
    blade_select_change_count_thres: 20
    min_bullet_speed: 18.0
    max_bullet_speed: 25.0
    default_bullet_speed: 22.0
    iterative_fly_time: true
    yaw_offset: 0.0
    pitch_offset: 0.0
    gravity: 9.80665
    air_resistance_coefficient: 0.0
    ballistic_max_iterate_count: 20

