# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 500
  y: 400
  width: 500
  height: 500

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 1.5 # degree
pitch_offset: -0.5 # degree
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.050 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 100 # 近距离射击容差，degree
second_tolerance: 100 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# 重投影误差: 0.1488px
camera_matrix: [1775.1300101814929, 0, 710.22041588791421, 0, 1777.9427175568535, 599.38373307949621, 0, 0, 1]
distort_coeffs: [-0.081907189655237952, 0.14019999270205855, -0.0012264127665053185, 0.0014292255962000792, 0]

# 相机同理想情况的偏角: yaw1.81 pitch0.16 roll-0.00 degree
R_camera2gimbal: [-0.03152275773856239, 0.0027095830669845509, 0.99949936163269204, -0.99950303430107212, -9.8404785402239625e-05, -0.031522606799691932, 1.2942398579498703e-05, -0.99999632423129503, 0.0027113384873522772]
t_camera2gimbal: [0.13895789074180098, 0.066620637390426771, 0.028079650211170731]


#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520   # s
predict_time: 0.100     # s
#####-----JLU TensorRT 10.3 auto_buff-----#####
jlu_buff:
  enable: true
  auto_fire_enable: true
  predict_offset_ms: 70.0
  detector:
    backend: tensorrt
    onnx_path: "models/buff/buff.onnx"
    engine_path: "models/buff/buff_trt10_3.engine"
    input_width: 640
    input_height: 640
    fp16: true
    confidence_threshold: 0.5
    nms_threshold: 0.45
    device_id: 0
    num_points: 5
  small_buff_conf:
    lost_threshold_sec: 0.8
    match_conf:
      max_match_distance_m: 1.0
      max_match_roll_diff_degree: 30.0
    blade_conf:
      pixel_error: {x: 5.0, y: 5.0}
      position_noise_m: {x: 0.03, y: 0.03, z: 0.03}
      roll_noise_degree: 2.0
    center_conf:
      position_consistency_noise_m: {x: 0.01, y: 0.01, z: 0.01}
      roll_noise_degree: 3.0
      vroll_noise_rad: 0.10
      position_prior_noise_m: {x: 0.10, y: 0.10, z: 0.10}
      roll_prior_noise_degree: 30.0
      vroll_prior_noise_rad: 6.0
  big_buff_conf:
    lost_threshold_sec: 1.0
    fitter_conf:
      queue_upper_limit: 200
      queue_lower_limit: 100
      param_lower_bound_scale: 1.0
      param_upper_bound_scale: 1.0
      curve_fitting_interval_time_ms: 20
    match_conf:
      max_match_distance_m: 1.0
      max_match_roll_diff_degree: 30.0
    blade_conf:
      pixel_error: {x: 5.0, y: 5.0}
      position_noise_m: {x: 0.03, y: 0.03, z: 0.03}
      roll_noise_degree: 2.0
    center_conf:
      position_consistency_noise_m: {x: 0.01, y: 0.01, z: 0.01}
      roll_noise_degree: 3.0
      vroll_noise_rad: 0.10
      position_prior_noise_m: {x: 0.10, y: 0.10, z: 0.10}
      roll_prior_noise_degree: 30.0
      vroll_prior_noise_rad: 6.0
  trajectory_conf:
    max_aim_iterate_count: 20
    aim_ok_error_m: 0.005
    blade_select_change_count_thres: 20
    min_bullet_speed: 18.0
    max_bullet_speed: 25.0
    default_bullet_speed: 22.0
    iterative_fly_time: true
    yaw_offset: 0.0
    pitch_offset: 0.0
    gravity: 9.80665
    air_resistance_coefficient: 0.0
    ballistic_max_iterate_count: 20

